# Streamlit theme + page config for the HSLU BINA / Halt AG dashboard.
# Light theme by default; Streamlit Cloud users can switch to dark in
# the settings menu and the palette below still reads cleanly.

[theme]
base = "light"
primaryColor = "#1f6feb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"
textColor = "#1a1d24"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
